# Copy this file to application-local.yml or configure the values as environment variables.
# Never commit real passwords, tokens, private keys, or API credentials.
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Second-hand-trading-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:25}
    max-concurrent-requests: ${AI_SERVICE_MAX_CONCURRENT_REQUESTS:8}
    queue-timeout-ms: ${AI_SERVICE_QUEUE_TIMEOUT_MS:150}
    service-token: ${AGENT_SERVICE_TOKEN}
    trace-retention-days: ${AGENT_TRACE_RETENTION_DAYS:90}
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  payment:
    return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/orders}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
      gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/orders}
    wechat:
      enabled: ${WECHAT_ENABLED:false}
      gateway: ${WECHAT_GATEWAY:https://api.mch.weixin.qq.com}
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      merchant-serial-no: ${WECHAT_MERCHANT_SERIAL_NO:}
      private-key: ${WECHAT_PRIVATE_KEY:}
      notify-url: ${WECHAT_NOTIFY_URL:}
