server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Second-hand-trading-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/second_hand_trade?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:/opt/app/uploads}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:25}
  jwt:
    secret: ${JWT_SECRET:campus_trade_2026_random_secret_abc123xyz789longkey}
    expire-minutes: 120
  payment:
    return-url: http://114.132.69.232/orders
    alipay:
      enabled: false
      gateway: https://openapi.alipay.com/gateway.do
      app-id:
      private-key:
      notify-url: http://114.132.69.232/api/payments/alipay/notify
      return-url: http://114.132.69.232/orders
    wechat:
      enabled: false
      gateway: https://api.mch.weixin.qq.com
      app-id:
      mch-id:
      merchant-serial-no:
      private-key:
      notify-url: http://114.132.69.232/api/payments/wechat/notify
