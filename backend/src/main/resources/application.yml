server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: Second-hand-trading-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/second_hand_trade?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:60}
    max-concurrent-requests: ${AI_SERVICE_MAX_CONCURRENT_REQUESTS:8}
    queue-timeout-ms: ${AI_SERVICE_QUEUE_TIMEOUT_MS:150}
    service-token: ${AGENT_SERVICE_TOKEN:}
    trace-retention-days: ${AGENT_TRACE_RETENTION_DAYS:90}
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: 120
  payment:
    return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/orders}
    alipay:
      enabled: false
      gateway: https://openapi.alipay.com/gateway.do
      app-id:
      private-key:
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/orders}
    wechat:
      enabled: false
      gateway: https://api.mch.weixin.qq.com
      app-id:
      mch-id:
      merchant-serial-no:
      private-key:
      notify-url: ${WECHAT_NOTIFY_URL:}
