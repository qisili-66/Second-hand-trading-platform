server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Second-hand-trading-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:/opt/app/uploads}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:25}
    max-concurrent-requests: ${AI_SERVICE_MAX_CONCURRENT_REQUESTS:8}
    queue-timeout-ms: ${AI_SERVICE_QUEUE_TIMEOUT_MS:150}
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: 120
  payment:
    return-url: http://114.132.69.232/orders
    alipay:
      enabled: false
      gateway: https://openapi.alipay.com/gateway.do
      app-id:
      private-key:
      notify-url: http://114.132.69.232/api/payments/alipay/notify
      return-url: http://114.132.69.232/orders
    wechat:
      enabled: false
      gateway: https://api.mch.weixin.qq.com
      app-id:
      mch-id:
      merchant-serial-no:
      private-key:
      notify-url: http://114.132.69.232/api/payments/wechat/notify
